name: esteira-ci-cd-pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew Wrapper
        run: chmod +x gradlew

      - name: Build App
        run: ./gradlew clean build -x test

      - name: Check Docker credentials
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ ERROR: DOCKER_USERNAME secret is not set"
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_TOKEN }}" ]; then
            echo "❌ ERROR: DOCKER_TOKEN secret is not set"
            exit 1
          fi
          echo "✅ Docker credentials are configured"

      - name: Auth to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
         context: .
         push: true
         tags:
           ${{ secrets.DOCKER_USERNAME }}/esteira-ci-cd:latest
           ${{ secrets.DOCKER_USERNAME }}/esteira-ci-cd:${{ github.sha }}
