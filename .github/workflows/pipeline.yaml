name: CI/CD

on:
  push:
  pull_request:

jobs:
  build:
    name: Build, Test & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: gradle-

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.REGISTRY_USERNAME }}/core-api:sha-${{ github.sha != '' && github.sha || 'local' }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && needs.build.result == 'success'

    concurrency:
      group: deploy-${{ secrets.DEPLOY_ENV }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy image
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          echo "Deploying image core-api:${IMAGE_TAG} to environment ${DEPLOY_ENV}"
          # Substituir este step pelo comando do seu provedor de nuvem,
          # usando ${{ secrets.CLOUD_CREDENTIALS }} ou equivalente.
